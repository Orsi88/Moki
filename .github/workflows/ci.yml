name: framework-checks

on:
  push:
  pull_request:
  # Disparo manual ou externo (ex.: pelo painel Nexo), sem precisar de commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (desktop app, qa command, tests)
        run: npm run typecheck
      - name: Build the desktop app
        run: npm run app:build
      - name: Validate skills, workflows, links, schemas and mirrors
        run: node scripts/validate.mjs
      - name: No run artifacts in the repository
        run: node scripts/check-artifacts.mjs --all
      - name: No known secret formats in the repository
        run: node scripts/check-secrets.mjs --all
      - name: Tests
        # Saída legível no log e um relatório JUnit para quem lê os resultados (ex.: o painel Nexo).
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/junit.xml
      - name: Publicar relatório dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
